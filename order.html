<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — ShopProject</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Оформление заказа</span>
    </nav>

    <section class="section">
      <h1 class="page-title">Оформление заявки на заказ</h1>
      <p>Заполните форму ниже, чтобы оформить заказ без использования всплывающих окон.</p>

      <form class="order-form" action="#" method="post" novalidate style="max-width: 600px;">
        <div class="order-form__field">
          <label class="order-form__label" for="page-order-name">Имя *</label>
          <input class="order-form__input" id="page-order-name" name="name" type="text" placeholder="Введите ваше имя" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-email">E-mail *</label>
          <input class="order-form__input" id="page-order-email" name="email" type="email" placeholder="example@mail.ru" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-phone">Телефон</label>
          <input class="order-form__input" id="page-order-phone" name="phone" type="tel" placeholder="+7 (900) 000-00-00">
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-comment">Комментарий к заказу</label>
          <textarea class="order-form__textarea" id="page-order-comment" name="comment" rows="4" placeholder="Укажите нужные позиции или примечания к доставке"></textarea>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Подтвердить заказ</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ShopProject. Все права защищены.</p>
  </footer>

  <a href="#" class="scroll-top" title="Наверх" aria-label="Вернуться к началу">↑</a>
</body>
</html>
